name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          }
      - name: Run test suite
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e .
          pytest -q
      - name: Build and validate distributions
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip uninstall -y loglens
          python -m pip install dist/*.whl
          loglens --help
          printf '%s\n' '2026-09-22T00:00:00Z INFO release smoke test' > /tmp/loglens-release-smoke.log
          loglens analyze /tmp/loglens-release-smoke.log --format text --json
      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loglens-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: loglens-release-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
