name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip pytest && python -m pip install -e .
      - name: Test
        run: pytest -q
      - name: Installed CLI smoke test
        run: |
          loglens --help
          printf '%s\n' '2026-09-16T00:00:00Z INFO service started' > /tmp/loglens-smoke.log
          loglens analyze /tmp/loglens-smoke.log --format text --json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distribution
        run: |
          python -m pip install -U pip build twine
          python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution artifacts exist
        run: test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - name: Preserve validated distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loglens-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
